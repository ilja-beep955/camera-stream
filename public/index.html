<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Видеосвязь (картинки)</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #222; color: white; padding: 20px; }
    .videos { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    video { width: 40%; background: #000; border: 2px solid #444; border-radius: 10px; }
    img { width: 40%; background: #000; border: 2px solid #444; border-radius: 10px; min-height: 240px; object-fit: cover; }
    input, button { padding: 10px 20px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; cursor: pointer; }
    button { background: #4CAF50; color: white; }
    button:hover { background: #45a049; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>Стриминг (через снимки)</h2>
  
  <div>
    <input id="roomInput" value="room1" placeholder="Комната">
    <button id="startBtn">Транслировать</button>
    <button id="watchBtn">Смотреть</button>
  </div>

  <div class="videos">
    <div>
      <p>Ваша камера</p>
      <video id="localVideo" autoplay muted playsinline></video>
    </div>
    <div>
      <p>Собеседник</p>
      <img id="remoteImage" alt="Ожидание видео...">
    </div>
  </div>

  <!-- Скрытый canvas для создания снимков -->
  <canvas id="canvas" style="display:none;"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const localVideo = document.getElementById('localVideo');
    const remoteImage = document.getElementById('remoteImage');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const roomInput = document.getElementById('roomInput');
    const startBtn = document.getElementById('startBtn');
    const watchBtn = document.getElementById('watchBtn');

    let stream = null;
    let sendInterval = null;

    // --- РЕЖИМ: ТРАНСЛИРУЮ ---
    startBtn.onclick = async () => {
      const room = roomInput.value.trim() || 'room1';
      startBtn.disabled = true;
      watchBtn.disabled = true;

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        localVideo.srcObject = stream;
        
        socket.emit('join-room', room);

        // Настраиваем отправку кадров (10 кадров в секунду = 100мс)
        const videoTrack = stream.getVideoTracks()[0];
        const { width, height } = videoTrack.getSettings();
        canvas.width = width || 640;
        canvas.height = height || 480;

        sendInterval = setInterval(() => {
          if (localVideo.readyState === 4) { // Если видео готово
            ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
            // Качество 0.5 (50%) чтобы не перегружать сервер
            const base64 = canvas.toDataURL('image/jpeg', 0.5);
            socket.emit('video-frame', base64);
          }
        }, 100); // 100 мс = 10 fps

      } catch (err) {
        alert("Ошибка доступа к камере: " + err.message);
        startBtn.disabled = false;
        watchBtn.disabled = false;
      }
    };

    // --- РЕЖИМ: СМОТРЮ ---
    watchBtn.onclick = () => {
      const room = roomInput.value.trim() || 'room1';
      startBtn.disabled = true;
      watchBtn.disabled = true;
      
      socket.emit('join-room', room);
      console.log("Подключились к комнате для просмотра:", room);
    };

    // --- ПРИЕМ КАДРОВ ---
    socket.on('video-frame', (base64Image) => {
      remoteImage.src = base64Image;
    });

    socket.on('user-disconnected', () => {
      console.log("Собеседник отключился");
      remoteImage.src = '';
      if (sendInterval) clearInterval(sendInterval);
    });
  </script>
</body>
</html>
