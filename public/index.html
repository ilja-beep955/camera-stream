<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Просмотр собеседника</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #222; color: white; padding: 20px; margin: 0; }
    .videos { display: flex; justify-content: center; margin-top: 20px; }
    .video-box { width: 100%; max-width: 800px; }
    video { width: 100%; background: #000; border: 2px solid #444; border-radius: 10px; aspect-ratio: 16/9; object-fit: cover; }
    .controls { margin: 20px 0; }
    input, button { padding: 10px 20px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; cursor: pointer; }
    button { background: #4CAF50; color: white; font-weight: bold; }
    button:hover { background: #45a049; }
    button:disabled { background: #555; cursor: not-allowed; }
    .status { font-size: 16px; color: #4CAF50; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Просмотр собеседника (невидимый режим)</h2>
  <div class="status" id="statusText">Введите комнату и нажмите "Смотреть"</div>
  
  <div class="controls">
    <input id="roomInput" value="room1" placeholder="Имя комнаты">
    <button id="watchBtn">Смотреть</button>
    <button id="leaveBtn" style="display:none; background: #d32f2f;">Выйти</button>
  </div>

  <div class="videos">
    <div class="video-box">
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const remoteVideo = document.getElementById('remoteVideo');
    const roomInput = document.getElementById('roomInput');
    const watchBtn = document.getElementById('watchBtn');
    const leaveBtn = document.getElementById('leaveBtn');
    const statusText = document.getElementById('statusText');

    let peerConnection = null;
    let currentRoom = '';

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
      ]
    };

    watchBtn.onclick = () => {
      currentRoom = roomInput.value.trim() || 'room1';
      
      watchBtn.style.display = 'none';
      roomInput.disabled = true;
      leaveBtn.style.display = 'inline-block';
      statusText.textContent = 'Подключение к комнате... Ожидание собеседника.';

      socket.emit('join-room', currentRoom);
    };

    leaveBtn.onclick = () => {
      if (peerConnection) peerConnection.close();
      window.location.reload();
    };

    // Мы НЕ запрашиваем камеру (getUserMedia), а только настраиваем прием
    function createPeerConnection(remoteSocketId) {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.ontrack = (event) => {
        remoteVideo.srcObject = event.streams[0];
        statusText.textContent = 'Видео собеседника получено!';
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('signal', { to: remoteSocketId, data: { candidate: event.candidate } });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'disconnected' || peerConnection.connectionState === 'failed') {
          statusText.textContent = 'Соединение потеряно...';
        }
      };
    }

    // Когда собеседник заходит, мы создаем соединение, но не добавляем свои треки
    socket.on('user-connected', async (userId) => {
      statusText.textContent = 'Собеседник найден, устанавливаем соединение...';
      createPeerConnection(userId);
      
      // Создаем Offer с приемом видео/аудио, но без отправки своих
      const offer = await peerConnection.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true });
      await peerConnection.setLocalDescription(offer);
      socket.emit('signal', { to: userId, data: { sdp: peerConnection.localDescription } });
    });

    socket.on('signal', async ({ from, data }) => {
      if (!peerConnection) createPeerConnection(from);

      if (data.sdp) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        if (data.sdp.type === 'offer') {
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit('signal', { to: from, data: { sdp: peerConnection.localDescription } });
        }
      } else if (data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error('ICE error:', e);
        }
      }
    });

    socket.on('user-disconnected', () => {
      statusText.textContent = 'Собеседник отключился.';
      if (peerConnection) peerConnection.close();
      peerConnection = null;
      remoteVideo.srcObject = null;
    });
  </script>
</body>
</html>
