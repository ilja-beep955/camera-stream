<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Видеосвязь через сервер</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #222; color: white; padding: 20px; }
    .videos { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    video { width: 40%; background: #000; border: 2px solid #444; border-radius: 10px; }
    input, button { padding: 10px 20px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; cursor: pointer; }
    button { background: #4CAF50; color: white; }
    button:hover { background: #45a049; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>Стриминг через сервер</h2>
  
  <div>
    <input id="roomInput" value="room1" placeholder="Комната">
    <button id="startBtn">Начать трансляцию</button>
    <button id="watchBtn">Смотреть</button>
  </div>

  <div class="videos">
    <div>
      <p>Ваша камера</p>
      <video id="localVideo" autoplay muted playsinline></video>
    </div>
    <div>
      <p>Собеседник</p>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <!-- Подключаем socket.io-stream для клиента -->
  <script src="https://cdn.jsdelivr.net/npm/socket.io-stream@0.9.1/socket.io-stream.js"></script>
  
  <script>
    const socket = io();
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const roomInput = document.getElementById('roomInput');
    const startBtn = document.getElementById('startBtn');
    const watchBtn = document.getElementById('watchBtn');

    let mediaRecorder;
    let stream;
    let viewerSocket = null;

    // --- РЕЖИМ: Я ТРАНСЛИРУЮ ---
    startBtn.onclick = async () => {
      const room = roomInput.value.trim() || 'room1';
      startBtn.disabled = true;
      watchBtn.disabled = true;

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        localVideo.srcObject = stream;

        socket.emit('join-room', room);

        // Настраиваем запись (отправляем чанки по 100мс)
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp8' });
        
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) {
            // Создаем поток для socket.io-stream и отправляем данные
            const streamData = ss.createStream();
            ss(socket).emit('stream-video', streamData);
            const blobStream = ss.createBlobReadStream(e.data);
            blobStream.pipe(streamData);
          }
        };
        
        mediaRecorder.start(100); 
        console.log("Трансляция началась в комнату:", room);

      } catch (err) {
        alert("Ошибка доступа к камере: " + err.message);
        startBtn.disabled = false;
        watchBtn.disabled = false;
      }
    };

    // --- РЕЖИМ: Я СМОТРЮ ---
    watchBtn.onclick = () => {
      const room = roomInput.value.trim() || 'room1';
      startBtn.disabled = true;
      watchBtn.disabled = true;
      
      socket.emit('join-room', room);
      console.log("Ожидание видео из комнаты:", room);
    };

    // --- ПРИЕМ ВИДЕО ---
    // Используем MediaSource API для сборки видео из чанков
    let mediaSource = new MediaSource();
    let sourceBuffer;
    remoteVideo.src = URL.createObjectURL(mediaSource);

    mediaSource.addEventListener('sourceopen', () => {
      sourceBuffer = mediaSource.addSourceBuffer('video/webm; codecs="vp8"');
    });

    ss(socket).on('stream-video', (stream) => {
      stream.on('data', (chunk) => {
        if (sourceBuffer && !sourceBuffer.updating) {
          try {
            sourceBuffer.appendBuffer(chunk);
          } catch (e) {
            console.error("Ошибка буфера:", e);
          }
        }
      });
    });

    // Когда кто-то заходит или выходит
    socket.on('user-connected', () => {
      if (startBtn.disabled && !mediaRecorder) {
        console.log("Собеседник подключился, начинаем ожидание потока...");
      }
    });

    socket.on('user-disconnected', () => {
      console.log("Собеседник отключился");
      remoteVideo.src = URL.createObjectURL(mediaSource); // Сбрасываем видео
    });
  </script>
</body>
</html>
