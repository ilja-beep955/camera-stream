<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Быстрая видеосвязь</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #222; color: white; padding: 20px; }
    .videos { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    video { width: 45%; background: #000; border: 2px solid #444; border-radius: 10px; }
    input, button { padding: 10px 20px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; cursor: pointer; }
    button { background: #4CAF50; color: white; }
    button:hover { background: #45a049; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <h2>Видеосвязь (WebRTC)</h2>
  
  <div>
    <input id="roomInput" value="room1" placeholder="Комната">
    <button id="joinBtn">Войти в комнату</button>
    <button id="leaveBtn" style="display:none; background: #d32f2f;">Выйти</button>
  </div>

  <div class="videos">
    <div>
      <p>Ваша камера</p>
      <video id="localVideo" autoplay muted playsinline></video>
    </div>
    <div>
      <p>Собеседник</p>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');
    const leaveBtn = document.getElementById('leaveBtn');

    let localStream = null;
    let peerConnection = null;
    let currentRoom = '';

    // Конфигурация серверов для обхода блокировок (STUN + TURN)
    const config = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    joinBtn.onclick = async () => {
      currentRoom = roomInput.value.trim() || 'room1';
      
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        
        joinBtn.style.display = 'none';
        roomInput.disabled = true;
        leaveBtn.style.display = 'inline-block';

        socket.emit('join-room', currentRoom);
      } catch (e) {
        alert('Нет доступа к камере/микрофону.');
      }
    };

    leaveBtn.onclick = () => {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConnection) peerConnection.close();
      window.location.reload();
    };

    // Создание P2P соединения
    function createPeerConnection(remoteSocketId) {
      peerConnection = new RTCPeerConnection(config);

      // Добавляем свои треки
      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      // Прием видео от собеседника
      peerConnection.ontrack = (event) => {
        remoteVideo.srcObject = event.streams[0];
      };

      // Передача ICE-кандидатов
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('signal', { to: remoteSocketId, data: { candidate: event.candidate } });
        }
      };
    }

    // Кто-то зашел в комнату
    socket.on('user-connected', async (userId) => {
      console.log('Пользователь подключился:', userId);
      createPeerConnection(userId);
      
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('signal', { to: userId, data: { sdp: peerConnection.localDescription } });
    });

    // Обработка сигналов
    socket.on('signal', async ({ from, data }) => {
      if (!peerConnection) createPeerConnection(from);

      if (data.sdp) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        if (data.sdp.type === 'offer') {
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit('signal', { to: from, data: { sdp: peerConnection.localDescription } });
        }
      } else if (data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error('ICE error:', e);
        }
      }
    });

    socket.on('user-disconnected', () => {
      if (peerConnection) peerConnection.close();
      peerConnection = null;
      remoteVideo.srcObject = null;
    });
  </script>
</body>
</html>
